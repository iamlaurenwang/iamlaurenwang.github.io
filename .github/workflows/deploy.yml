name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允許在 Actions 頁面手動觸發
  workflow_dispatch:

# GITHUB_TOKEN 權限:讀取原始碼、寫入 Pages、OIDC 驗證
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署,新的 push 會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
